<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.6" />

  <!-- Background Glowing Circles -->
  <circle cx="160" cy="160" r="90" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle cx="360" cy="360" r="110" fill="#ec4899" opacity="0.15" filter="url(#glow)" />

  <!-- Graduation Cap (UniSchedule Icon) -->
  <g transform="translate(256, 230) scale(1.1)" filter="url(#glow)">
    <!-- Top Rhombus -->
    <polygon points="0,-90 150,-20 0,50 -150,-20" fill="url(#neonGrad)" />
    
    <!-- Cap Underneath Base -->
    <path d="M-85,0 C-85,55 85,55 85,0 L85,25 C85,80 -85,80 -85,25 Z" fill="#ffffff" opacity="0.9" />

    <!-- Tassel -->
    <path d="M-15,-20 L-145,-15 C-155,20 -150,60 -155,90" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
    <circle cx="-155" cy="95" r="9" fill="#06b6d4" />
  </g>

  <!-- Text / Subtitle Badge -->
  <rect x="136" y="380" width="240" height="46" rx="23" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ФИиИТ ДГУ</text>
</svg>
